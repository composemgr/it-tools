# nginx proxy address - http://172.17.0.1:60018

name: it-tools
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: corentinth/it-tools:latest
    container_name: it-tools-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: it-tools-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:60018:80'
    networks:
      - it-tools
      - proxy
      - cloudflare
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://it-tools-app:80'
      - 'cloudflare.hostname=it-tools.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.it-tools-app.entrypoints=http'
      - 'traefik.http.routers.it-tools-app-secure.tls=true'
      - 'traefik.http.routers.it-tools-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.it-tools-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.it-tools-app.middlewares=it-tools-app-https-redirect'
      - 'traefik.http.routers.it-tools-app-secure.entrypoints=https'
      - 'traefik.http.routers.it-tools-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.it-tools-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.it-tools-app-secure.service=it-tools-app'
      - 'traefik.http.services.it-tools-app.loadbalancer.server.port=80'

networks:
  it-tools:
    name: it-tools
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
