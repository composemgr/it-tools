name: it-tools
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: corentinth/it-tools:latest
    container_name: it-tools-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: it-tools-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://it-tools-app:80'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - it-tools
      - cloudflare

networks:
  it-tools:
    name: it-tools
    external: false
  cloudflare:
    external: true
